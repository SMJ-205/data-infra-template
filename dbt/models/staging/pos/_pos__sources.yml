version: 2

sources:
  - name: pos
    description: OLTP POS & inventori F&B (Neon Postgres, schema fnb), di-ingest dlt ke raw_fnb.
    database: "{{ env_var('GCP_PROJECT_ID', 'fnb-data-platform') }}"
    schema: raw_fnb
    tables:
      - name: orders
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: order_items
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: order_item_modifiers
        loaded_at_field: updated_at
      - name: payments
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: refunds
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 72, period: hour}
          error_after: {count: 168, period: hour}
      - name: waste_logs
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 26, period: hour}
          error_after: {count: 50, period: hour}
      - name: goods_receipts
        loaded_at_field: updated_at
        freshness:
          warn_after: {count: 50, period: hour}
          error_after: {count: 96, period: hour}
      - name: goods_receipt_lines
        loaded_at_field: updated_at
      - name: stock_counts
        loaded_at_field: updated_at
      - name: stock_count_lines
        loaded_at_field: updated_at
      - name: outlets
      - name: employees
      - name: customers
      - name: sales_channels
      - name: channel_commission_rates
      - name: promotions
      - name: menu_categories
      - name: menu_items
      - name: menu_item_prices
      - name: modifiers
      - name: modifier_lines
      - name: ingredients
      - name: ingredient_standard_costs
      - name: suppliers
      - name: recipes
      - name: recipe_lines
      - name: waste_reasons
      - name: expense_categories
      - name: operating_expenses
