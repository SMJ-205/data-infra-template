version: 2

models:
  - name: dim_date
    description: Dimensi tanggal spine dengan informasi event nasional, libur, dan ramadan.
    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

  - name: dim_outlet
    description: Dimensi outlet dan status operasional.
    columns:
      - name: outlet_id
        data_tests:
          - not_null
          - unique

  - name: dim_menu_item
    description: Dimensi menu item dengan harga aktif dan food cost % terkini.
    columns:
      - name: menu_item_id
        data_tests:
          - not_null
          - unique

  - name: dim_ingredient
    description: Dimensi bahan baku (raw & prep) dan standard cost terkini.
    columns:
      - name: ingredient_id
        data_tests:
          - not_null
          - unique

  - name: dim_channel
    description: Dimensi sales channel dan komisi saat ini.
    columns:
      - name: channel_code
        data_tests:
          - not_null
          - unique

  - name: fct_order_lines
    description: >
      Fact order lines dengan perhitungan revenue, alokasi diskon pro-rata, dan standard COGS.
      Incremental insert_overwrite per order_date dengan penanganan late-arriving data (macros/incremental.sql).
    columns:
      - name: order_item_id
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fct_orders')
              field: order_id
      - name: std_cost_per_unit
        data_tests:
          - not_null:
              where: "is_revenue_line"
      - name: source_updated_at_utc
        description: Waktu perubahan terakhir di source (order / item / modifier). Basis watermark incremental.
        data_tests:
          - not_null

  - name: fct_orders
    description: >
      Fact orders level transaksi order. Incremental insert_overwrite per order_date dengan penanganan
      late-arriving data (macros/incremental.sql).
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: source_updated_at_utc
        description: Waktu perubahan terakhir di source (order / payment / order lines). Basis watermark incremental.
        data_tests:
          - not_null

  - name: fct_waste
    description: Fact catatan limbah (waste) dengan valuasi HPP standar tanggal kejadian.
    columns:
      - name: waste_id
        data_tests:
          - not_null
          - unique
      - name: waste_cost_amount
        data_tests:
          - not_null

  - name: fct_refunds
    description: Fact refund pesanan.
    columns:
      - name: refund_id
        data_tests:
          - not_null
          - unique

  - name: fct_goods_receipt_lines
    description: Fact detail penerimaan barang dari supplier.
    columns:
      - name: gr_line_id
        data_tests:
          - not_null
          - unique

  - name: fct_stock_counts
    description: Fact stock opname berkala.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [count_id, ingredient_id]

  - name: fct_inventory_balance_daily
    description: >
      Saldo stok harian per outlet x bahan raw (spine padat). on_hand_qty = stock count terakhir + pergerakan
      bersih sesudahnya; di-reset setiap opname. Incremental: hanya bulan sejak tanggal pertama yang berubah
      yang dihitung ulang, saldo dilanjutkan dari baris sebelumnya (lihat header model).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [balance_date, outlet_id, ingredient_id]
    columns:
      - name: on_hand_qty
        description: Saldo akhir hari (base uom) berbasis opname terakhir + pergerakan teoretis sesudahnya.
        data_tests:
          - not_null
      - name: counted_qty
        description: Hasil opname (ekuivalen bahan raw) pada tanggal itu; NULL bila tidak ada opname.
      - name: count_variance_qty
        description: >
          counted_qty - (saldo kemarin + pergerakan hari ini). Negatif = susut/tak tercatat (mis. overpour).
          Identik dengan -unexplained_variance_qty di mart_inventory_variance (dijaga test).
      - name: days_on_hand
        description: on_hand_qty / rata-rata pemakaian (sales + waste) 28 hari terakhir.
      - name: is_negative_on_hand
        description: Saldo teoretis negatif → pemakaian riil melebihi stok tercatat (receipt hilang / overpour).
