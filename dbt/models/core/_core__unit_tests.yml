unit_tests:
  - name: test_order_lines_incremental_rebuilds_partition_of_late_order
    description: >
      Watermark = max(source_updated_at_utc) di target (14 Okt 12:00) - lookback 3 hari = 11 Okt 12:00.
      O_LATE dipesan 9 Okt tapi baru tersinkron 15 Okt (terlambat 6 hari, lebih dari lookback).
      Karena seleksi berbasis updated_at, partisi 9 Okt tetap dibangun ulang UTUH: O_LATE masuk dan
      O_OLD (9 Okt, tidak berubah) ikut dipilih agar tidak terhapus oleh insert_overwrite.
      Partisi 10 Okt (O1, tidak berubah & di luar watermark) tidak disentuh.
    model: fct_order_lines
    overrides:
      macros:
        is_incremental: true
    given:
      # format sql: fixture tidak divalidasi terhadap skema tabel target yang sudah ada, sehingga test tetap
      # jalan sebelum full refresh pertama yang menambahkan kolom watermark.
      - input: this
        format: sql
        rows: |
          select 1 as order_item_id, date '2026-10-09' as order_date, timestamp '2026-10-09 05:00:00' as source_updated_at_utc union all
          select 2, date '2026-10-10', timestamp '2026-10-10 05:00:00' union all
          select 3, date '2026-10-14', timestamp '2026-10-14 12:00:00'
      - input: ref('stg_pos__orders')
        rows:
          - {order_id: O_OLD,  order_date: 2026-10-09, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2026-10-09 05:00:00"}
          - {order_id: O1,     order_date: 2026-10-10, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2026-10-10 05:00:00"}
          - {order_id: O2,     order_date: 2026-10-14, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2026-10-14 12:00:00"}
          - {order_id: O_LATE, order_date: 2026-10-09, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2026-10-15 02:00:00"}
          - {order_id: O3,     order_date: 2026-10-15, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2026-10-15 03:00:00"}
      - input: ref('stg_pos__order_items')
        rows:
          - {order_item_id: 1, order_id: O_OLD,  menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-09 05:00:00"}
          - {order_item_id: 2, order_id: O1,     menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-10 05:00:00"}
          - {order_item_id: 3, order_id: O2,     menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-14 12:00:00"}
          - {order_item_id: 4, order_id: O_LATE, menu_item_id: MNU_A, line_status: Served, qty: 2, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-15 02:00:00"}
          - {order_item_id: 5, order_id: O3,     menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-15 03:00:00"}
      - input: ref('stg_pos__order_item_modifiers')
        rows: []
      - input: ref('stg_pos__promotions')
        rows: []
      - input: ref('int_item_std_cost_daily')
        rows:
          - {date_day: 2026-10-09, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
          - {date_day: 2026-10-10, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
          - {date_day: 2026-10-14, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
          - {date_day: 2026-10-15, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
    expect:
      rows:
        - {order_item_id: 1, order_id: O_OLD,  order_date: 2026-10-09, net_sales_amount: 20000, cogs_std_amount: 6000,  source_updated_at_utc: "2026-10-09 05:00:00"}
        - {order_item_id: 4, order_id: O_LATE, order_date: 2026-10-09, net_sales_amount: 40000, cogs_std_amount: 12000, source_updated_at_utc: "2026-10-15 02:00:00"}
        - {order_item_id: 3, order_id: O2,     order_date: 2026-10-14, net_sales_amount: 20000, cogs_std_amount: 6000,  source_updated_at_utc: "2026-10-14 12:00:00"}
        - {order_item_id: 5, order_id: O3,     order_date: 2026-10-15, net_sales_amount: 20000, cogs_std_amount: 6000,  source_updated_at_utc: "2026-10-15 03:00:00"}

  - name: test_order_lines_full_refresh_selects_everything
    description: Tanpa is_incremental (build pertama / --full-refresh), semua baris dipilih tanpa filter watermark.
    model: fct_order_lines
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_pos__orders')
        rows:
          - {order_id: O1, order_date: 2025-07-01, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Completed, order_discount_amount: 0, updated_at_utc: "2025-07-01 05:00:00"}
          - {order_id: O2, order_date: 2026-10-15, outlet_id: FLG-01, channel_code: DINE_IN, order_status: Cancelled, order_discount_amount: 0, updated_at_utc: "2026-10-15 05:00:00"}
      - input: ref('stg_pos__order_items')
        rows:
          - {order_item_id: 1, order_id: O1, menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2025-07-01 05:00:00"}
          - {order_item_id: 2, order_id: O2, menu_item_id: MNU_A, line_status: Served, qty: 1, unit_price: 20000, line_discount_amount: 0, updated_at_utc: "2026-10-15 05:00:00"}
      - input: ref('stg_pos__order_item_modifiers')
        rows: []
      - input: ref('stg_pos__promotions')
        rows: []
      - input: ref('int_item_std_cost_daily')
        rows:
          - {date_day: 2025-07-01, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
          - {date_day: 2026-10-15, item_type: Menu Item, item_id: MNU_A, std_cost_per_unit: 6000}
    expect:
      rows:
        - {order_item_id: 1, is_revenue_line: true,  net_sales_amount: 20000}
        - {order_item_id: 2, is_revenue_line: false, net_sales_amount: 0}

  - name: test_inventory_balance_continues_from_seed_and_resets_on_count
    description: >
      Target sudah berisi s.d. 30 Sep (saldo 100, opname terakhir 28 Sep) dan cocok dengan source → hanya
      Oktober yang dihitung (rebuild_from = 1 Okt). 1 Okt jual 10 → 90; 2 Okt beli 50 → 140;
      3 Okt jual 5 lalu opname 130 → ekspektasi 135, selisih -5, saldo di-reset ke 130.
    model: fct_inventory_balance_daily
    overrides:
      macros:
        is_incremental: true
    given:
      - input: this
        format: sql
        rows: |
          select date '2026-09-29' as balance_date, 'FLG-01' as outlet_id, 'ING_X' as ingredient_id,
                 numeric '0' as purchased_qty, numeric '0' as purchased_amount, numeric '0' as theoretical_sales_qty,
                 numeric '0' as waste_qty, cast(null as numeric) as counted_qty, numeric '100' as on_hand_qty,
                 date '2026-09-28' as last_count_date
          union all
          select date '2026-09-30', 'FLG-01', 'ING_X', 0, 0, 0, 0, null, 100, date '2026-09-28'
      - input: ref('util_dates')
        rows:
          - {date_day: 2026-09-29}
          - {date_day: 2026-09-30}
          - {date_day: 2026-10-01}
          - {date_day: 2026-10-02}
          - {date_day: 2026-10-03}
      - input: ref('dim_outlet')
        rows:
          - {outlet_id: FLG-01}
      - input: ref('stg_pos__ingredients')
        rows:
          - {ingredient_id: ING_X, is_prep_item: false}
      - input: ref('fct_inventory_movements_daily')
        rows:
          - {outlet_id: FLG-01, movement_date: 2026-10-01, ingredient_id: ING_X, theoretical_sales_qty: 10, waste_qty: 0, purchased_qty: 0,  purchased_amount: 0}
          - {outlet_id: FLG-01, movement_date: 2026-10-02, ingredient_id: ING_X, theoretical_sales_qty: 0,  waste_qty: 0, purchased_qty: 50, purchased_amount: 50000}
          - {outlet_id: FLG-01, movement_date: 2026-10-03, ingredient_id: ING_X, theoretical_sales_qty: 5,  waste_qty: 0, purchased_qty: 0,  purchased_amount: 0}
      - input: ref('fct_stock_counts')
        rows:
          - {outlet_id: FLG-01, count_date: 2026-10-03, ingredient_id: ING_X, counted_qty_base: 130}
      - input: ref('int_item_explosion_daily')
        rows: []
      - input: ref('int_item_std_cost_daily')
        rows: []
    expect:
      rows:
        - {balance_date: 2026-10-01, on_hand_qty: 90,  last_count_date: 2026-09-28, counted_qty: null, count_variance_qty: null}
        - {balance_date: 2026-10-02, on_hand_qty: 140, last_count_date: 2026-09-28, counted_qty: null, count_variance_qty: null}
        - {balance_date: 2026-10-03, on_hand_qty: 130, last_count_date: 2026-10-03, counted_qty: 130,  count_variance_qty: -5}
