version: 2

seeds:
  - name: kpi_thresholds
    config:
      schema: core
      column_types:
        metric_code: string
        outlet_type: string
        metric_name: string
        direction: string
        warn_threshold: numeric
        critical_threshold: numeric
        effective_from: date
        effective_to: date

  - name: id_calendar_events
    config:
      schema: core
      column_types:
        event_name: string
        event_type: string
        start_date: date
        end_date: date

  - name: hr_salary_bands
    description: Band gaji pasar (asumsi, Jakarta 2025) per jabatan full-time; dasar compa-ratio.
    config:
      schema: core
      enabled: "{{ var('enable_hr', false) }}"
      column_types:
        job_role: string
        band_min: numeric
        band_mid: numeric
        band_max: numeric
