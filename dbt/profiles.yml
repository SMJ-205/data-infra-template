fnb_data_platform:
  target: prod
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'fnb-data-platform') }}"
      dataset: "dbt_{{ env_var('DBT_USER', 'dev') }}"
      location: asia-southeast2
      threads: 4
      priority: interactive
      job_execution_timeout_seconds: 300
      job_retries: 1
      maximum_bytes_billed: 2000000000
    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'fnb-data-platform') }}"
      dataset: "dbt_ci_pr{{ env_var('PR_NUMBER', '0') }}"
      location: asia-southeast2
      threads: 4
      job_execution_timeout_seconds: 300
      maximum_bytes_billed: 2000000000
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID', 'fnb-data-platform') }}"
      dataset: analytics
      location: asia-southeast2
      threads: 8
      job_execution_timeout_seconds: 600
      job_retries: 2
      maximum_bytes_billed: 2000000000
