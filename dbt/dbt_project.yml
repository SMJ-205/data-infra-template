name: 'fnb_data_platform'
version: '2.0.0'
config-version: 2
profile: 'fnb_data_platform'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

flags:
  send_anonymous_usage_stats: false

query-comment:
  append: true
  job-label: true

vars:
  local_tz: 'Asia/Jakarta'
  start_date: "date '2025-07-01'"
  lookback_days: 3
  bom_max_depth: 10              # batas rekursi explosion BOM (int_item_explosion_daily)
  secrets_dataset: 'ops_secrets'
  'dbt_date:time_zone': 'Asia/Jakarta'

models:
  fnb_data_platform:
    +persist_docs: {relation: true, columns: true}
    +labels: {project: fnb, managed_by: dbt}
    staging:
      +materialized: view
      +schema: stg
      +tags: ["staging", "daily"]
    intermediate:
      +materialized: table
      +schema: int
      +tags: ["intermediate", "daily"]
    core:
      +materialized: table
      +schema: core
      +tags: ["core", "daily"]
    marts:
      +materialized: table
      +schema: marts
      +tags: ["mart"]


seeds:
  fnb_data_platform:
    +schema: core

snapshots:
  fnb_data_platform:
    +schema: snapshots
