  online_merchant: [HEMAT10, POTONG5K]
  online_platform: {GOFOOD: GOFOOD15, GRABFOOD: GRAB20, SHOPEEFOOD: SHOPEE12}
  online_platform_prob: 0.60

inventory:
  count_noise_sd: 0.005
  waste_item_prob: 0.025                 # produk jatuh / QC reject (target 2-3% total waste)
  prep_spoil_prob: 0.20                  # sisa prep batch tidak terpakai
